- name: Deploy Docker container
  hosts: webserver
  become: yes

  tasks:

    - name: Install Docker and dependencies
      apt:
        name:
          - docker.io
          - python3-docker
        state: present
        update_cache: yes

    - name: Ensure Docker service is running
      service:
        name: docker
        state: started
        enabled: yes

    - name: Run Docker container from DockerHub
      docker_container:
        name: myapp-container
        image: devenops641/myapp:v1
        state: started
        restart_policy: always
        ports:
          - "8090:8090"

