plugin: amazon.aws.aws_ec2
regions:
  - us-east-1

filters:
  instance-state-name: running
  tag:role: webserver

hostnames:
  - private-ip-address

compose:
  ansible_host: private_ip_address
  ansible_user: ubuntu
  ansible_ssh_private_key_file: /home/ubuntu/.ssh/prod.pem

keyed_groups:
  - key: tags.role
    prefix: ""
    separator: ""
